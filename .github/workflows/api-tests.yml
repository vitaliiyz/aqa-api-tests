name: API tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code format & lint checks
        run: |
          black --check .
          ruff check .

      - name: Run pytest
        if: always()
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          pytest -v --html=report.html \
          --self-contained-html \
          --md-report \
          --md-report-output=summary.md \
          --alluredir=allure-results \
          --clean-alluredir

      - name: Publish Job Summary
        if: always()
        run: cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-api-report
          path: report.html

      - name: Install Allure CLI
        if: always()
        run: npm install --global allure-commandline

      - name: Generate Allure Report
        if: always()
        run: allure generate allure-results --clean --output allure-report

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-api-report
          path: allure-report

      - name: Upload Allure Report for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy:
    name: Deploy Allure Report
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5